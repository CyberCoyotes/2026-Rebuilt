# Gradle daemon heap. The default (512 MB) is too small for the deploy step:
# `deployfrcJava` fails with "Java heap space" while packaging/uploading the fat jar.
# Raised to 2 GB 10-2-2026. Overriding jvmargs also drops Gradle's default
# -XX:+HeapDumpOnOutOfMemoryError, so java_pid*.hprof files stop landing in the repo root.
org.gradle.jvmargs=-Xmx2g
